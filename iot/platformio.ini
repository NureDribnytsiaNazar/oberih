; Прошивка IoT-вузла «Оберіг» (ЛБ4).
;   pio run -e esp32dev      — збирання для ESP32 (симуляція Wokwi)
;   pio test -e native       — юніт-тести чистої логіки на ПК

[platformio]
default_envs = esp32dev

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Попередження вмикаємо лише для власного коду (не для фреймворку).
build_src_flags = -Wall -Wextra
lib_deps = bblanchon/ArduinoJson@7.2.1

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
test_build_src = yes
; Модулі, що працюють з Arduino API, на ПК не збираються.
build_src_filter = +<*> -<main.cpp> -<node_app.cpp> -<net_client.cpp> -<nvs_storage.cpp>

; Лише для розробки: TLS без перевірки сертифіката сервера (setInsecure).
; Для демонстрації використовуйте esp32dev із OBERIH_CA_CERT у secrets.h.
[env:esp32dev_devtls]
extends = env:esp32dev
build_flags = ${env.build_flags} -DOBERIH_DEV_TLS
