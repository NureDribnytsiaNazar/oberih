# Спільні налаштування проксі для HTTPS-сервера й входу тунелю
# (підключається директивою include з oberih.conf).

client_max_body_size 2m;  # найбільший запит — імпорт налаштувань об'єкта

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Перезаписуємо заголовки, а не доповнюємо: застосунок бачить лише адресу,
# яку визначив Nginx. Зовні з'єднання завжди HTTPS (тут або в тунелі).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 60s;

location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://oberih_api;
}

location /api/v1/device/ {
    limit_req zone=device burst=20 nodelay;
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://oberih_api;
}

location / {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://oberih_api;
}
