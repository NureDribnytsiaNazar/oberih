# Nginx перед серверною частиною «Оберіг» (ЛБ5): TLS, зворотний проксі,
# заголовки безпеки, обмеження розміру тіла й частоти запитів (СЧ-1).
# Файл монтується як шаблон /etc/nginx/templates/default.conf.template:
# образ nginx підставляє змінні середовища (${HTTPS_PORT}) і записує
# /etc/nginx/conf.d/default.conf (контекст http). Змінні nginx ($host тощо)
# не змінюються, бо таких змінних середовища немає.

# --- Справжня адреса клієнта ------------------------------------------------
# За тунелем (cloudflared на машині розгортання) або іншим проксі з приватної
# мережі адреса клієнта приходить у X-Forwarded-For. Довіряємо їй лише від
# приватних адрес, тому клієнт з інтернету підробити її не може.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Обмеження частоти запитів (СЧ-1, припущення 11) ------------------------
# Вхід, реєстрація, оновлення токена: 10 запитів за хвилину з адреси.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Решта API: 10 запитів за секунду з адреси.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# Вузли: окремо для кожного токена пристрою (2 запити за секунду). Вузол
# надсилає heartbeat раз на 30 с і пакети подій, тож легітимний потік, навіть
# буфер після відновлення зв'язку, у межі вкладається.
limit_req_zone $http_x_device_token zone=device:10m rate=2r/s;
limit_req_status 429;
limit_req_log_level warn;

upstream oberih_api {
    server api:8000;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;
    location / {
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # Самопідписаний сертифікат створює deploy/make-dev-cert.ps1; на VPS —
    # сертифікат Let's Encrypt (див. docs/deploy.md). Ключі в git не потрапляють.
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/oberih/locations.conf;
}

# Вхід для тунелю (cloudflared): TLS завершується в мережі Cloudflare, тому
# тут HTTP без редиректу. Порт публікується лише на 127.0.0.1 машини
# розгортання (TUNNEL_PORT), тож ззовні напряму недоступний.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    include /etc/nginx/oberih/locations.conf;
}
