# Nginx перед серверною частиною «Оберіг» (ЛБ5): TLS, зворотний проксі,
# заголовки безпеки, обмеження розміру тіла й частоти запитів (СЧ-1).
# Файл підключається в контекст http як /etc/nginx/conf.d/default.conf.

# --- Справжня адреса клієнта ------------------------------------------------
# За тунелем (cloudflared на машині розгортання) або іншим проксі з приватної
# мережі адреса клієнта приходить у X-Forwarded-For. Довіряємо їй лише від
# приватних адрес, тому клієнт з інтернету підробити її не може.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Обмеження частоти запитів (СЧ-1, припущення 11) ------------------------
# Вхід, реєстрація, оновлення токена: 10 запитів за хвилину з адреси.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Решта API: 10 запитів за секунду з адреси.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# Вузли: окремо для кожного токена пристрою (2 запити за секунду). Вузол
# надсилає heartbeat раз на 30 с і пакети подій, тож легітимний потік, навіть
# буфер після відновлення зв'язку, у межі вкладається.
limit_req_zone $http_x_device_token zone=device:10m rate=2r/s;
limit_req_status 429;
limit_req_log_level warn;

upstream oberih_api {
    server api:8000;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # Самопідписаний сертифікат створює deploy/make-dev-cert.ps1; на VPS —
    # сертифікат Let's Encrypt (див. docs/deploy.md). Ключі в git не потрапляють.
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Найбільший запит — імпорт налаштувань об'єкта (JSON).
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Перезаписуємо заголовки, а не доповнюємо: застосунок бачить лише
    # адресу, яку визначив Nginx.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;

    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://oberih_api;
    }

    location /api/v1/device/ {
        limit_req zone=device burst=20 nodelay;
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://oberih_api;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://oberih_api;
    }
}
