# Налаштування інструментів якості коду серверної частини.

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "alembic/versions"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Попередження сторонньої бібліотеки тестового клієнта, на код не впливає.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
