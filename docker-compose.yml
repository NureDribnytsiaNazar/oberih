services:
  db:
    image: postgres:16-alpine
    container_name: oberih-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oberih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oberih_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-oberih}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oberih-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oberih} -d ${POSTGRES_DB:-oberih}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oberih-db-data:
